<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Digital Pintar</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            display: flex; 
            height: 100vh; 
            background-color: #f4f6f9; 
            overflow: hidden;
        }
        
        /* --- SIDEBAR PANEL --- */
        #sidebar { 
            width: 350px; 
            background-color: #2c3e50; 
            color: white; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 3px 0 10px rgba(0,0,0,0.15);
            z-index: 10;
        }
        #sidebar h2 { 
            margin-bottom: 15px; 
            font-size: 20px; 
            border-bottom: 2px solid #34495e; 
            padding-bottom: 10px; 
            text-align: center;
        }
        
        /* Area Input Pencarian & Filter */
        .filter-container { 
            margin-bottom: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        #search-box, #category-filter { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            background-color: #34495e; 
            color: white; 
            font-size: 14px; 
            outline: none; 
            transition: 0.3s;
        }
        #search-box:focus, #category-filter:focus {
            background-color: #3d566e;
            box-shadow: 0 0 5px #3498db;
        }
        #search-box::placeholder { color: #95a5a6; }
        #category-filter option { background-color: #2c3e50; color: white; }
        
        /* --- DAFTAR BUKU (GRID THUMBNAIL) --- */
        #book-list { 
            flex: 1; 
            overflow-y: auto; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            padding-right: 5px;
        }
        #book-list::-webkit-scrollbar { width: 6px; }
        #book-list::-webkit-scrollbar-thumb { background: #34495e; border-radius: 10px; }
        
        /* Kartu Buku */
        .book-item { 
            background-color: #34495e; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: transform 0.2s, background-color 0.3s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }
        .book-item:hover { 
            transform: translateY(-3px);
            background-color: #3d566e;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .book-item.active { 
            background-color: #3498db; 
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }
        
        /* Gambar Sampul Buku */
        .book-thumbnail { 
            width: 100%; 
            height: 160px; 
            object-fit: cover; 
            border-radius: 5px; 
            margin-bottom: 8px; 
            background-color: #2c3e50;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .book-title { 
            font-size: 13px; 
            font-weight: bold; 
            color: white; 
            width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;  
            overflow: hidden;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .book-author { 
            font-size: 11px; 
            color: #bdc3c7; 
            font-style: italic;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
        }
        
        /* --- AREA MEMBACA (RIGHT SIDE) --- */
        #viewer-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background-color: #ffffff; 
        }
        #viewer-header { 
            padding: 15px 20px; 
            background-color: #ffffff; 
            border-bottom: 1px solid #e0e0e0; 
            font-size: 18px; 
            font-weight: bold; 
            color: #333; 
        }
        iframe { width: 100%; height: 100%; border: none; }
        .loading { color: #bdc3c7; font-style: italic; text-align: center; grid-column: 1 / -1; margin-top: 30px; }
        .placeholder-text { margin: auto; font-size: 18px; color: #7f8c8d; text-align: center; }
    </style>
</head>
<body>

    <!-- Panel Samping: Rak Buku -->
    <div id="sidebar">
        <h2>Rak Buku Digital</h2>
        <div class="filter-container">
            <input type="text" id="search-box" placeholder="Cari judul atau pengarang..." onkeyup="filterBooks()">
            <select id="category-filter" onchange="filterBooks()">
                <option value="">-- Semua Kategori --</option>
            </select>
        </div>
        <div id="book-list">
            <div class="loading">Memuat daftar buku...</div>
        </div>
    </div>

    <!-- Panel Utama: Area Membaca PDF -->
    <div id="viewer-container">
        <div id="viewer-header">Pustaka Digital</div>
        <div id="no-book" class="placeholder-text">Silakan pilih buku di menu samping untuk mulai membaca</div>
        <iframe id="pdf-viewer" src="" allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" style="display:none;"></iframe>
    </div>
    <script>
        // =========================================================================
        // PENTING: GANTI DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        // =========================================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbzGbe5o1u5OSvxI-_SQswpPhBcgixajjAtu3nyFaze5GxgSEDCOt543aq0deY0P_zbhWA/exec";
        
        let allBooks = []; 

        // 1. Ambil data otomatis dari Google Sheets lewat API
        async function loadBooks() {
            try {
                const response = await fetch(API_URL);
                allBooks = await response.json();
                
                populateCategories(allBooks);
                renderBooks(allBooks);
            } catch (error) {
                console.error("Gagal memuat buku:", error);
                document.getElementById('book-list').innerHTML = '<div class="loading" style="color:#e74c3c;">Gagal terhubung ke database buku.</div>';
            }
        }

        // 2. Kumpulkan opsi kategori unik ke dalam Dropdown secara dinamis
        function populateCategories(books) {
            const filterSelect = document.getElementById('category-filter');
            const categories = new Set();

            books.forEach(book => {
                if (book.kategori && book.kategori.trim() !== "") {
                    categories.add(book.kategori.trim());
                }
            });

            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.innerText = category;
                filterSelect.appendChild(option);
            });
        }

        // 3. Tampilkan list buku ke halaman dalam bentuk Grid Kartu Bergambar
        function renderBooks(booksToRender) {
            const listContainer = document.getElementById('book-list');
            listContainer.innerHTML = ''; 

            if(booksToRender.length === 0) {
                listContainer.innerHTML = '<div class="loading">Buku tidak ditemukan.</div>';
                return;
            }

            booksToRender.forEach((book, index) => {
                const item = document.createElement('div');
                item.className = 'book-item';
                
                const thumbnailUrl = "https://drive.google.com/file/d/"+book.id`;
                
                item.innerHTML = `
                    <img class="book-thumbnail" src="${thumbnailUrl}" alt="${book.judul}" onerror="this.src='https://placehold.co'">
                    <div class="book-title" title="${book.judul}">${book.judul}</div>
                    <div class="book-author" title="${book.pengarang || 'Anonim'}">${book.pengarang || 'Anonim'}</div>
                `;
                
                item.onclick = () => selectBook(item, book.id, book.judul, book.pengarang);
                listContainer.appendChild(item);
            });
        }

        // 4. Logika Pencarian Kata Kunci + Filter Dropdown Kategori
        function filterBooks() {
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const selectedCategory = document.getElementById('category-filter').value;
            
            const filtered = allBooks.filter(book => {
                const judulCocok = book.judul.toLowerCase().includes(keyword);
                const pengarangCocok = (book.pengarang || '').toLowerCase().includes(keyword);
                const kataKunciCocok = judulCocok || pengarangCocok;
                
                const kategoriCocok = selectedCategory === "" || book.kategori === selectedCategory;
                
                return kataKunciCocok && kategoriCocok;
            });
            
            renderBooks(filtered);
        }

        // 5. Menampilkan PDF Buku yang dipilih ke dalam iframe penampil
        function selectBook(element, fileId, bookTitle, bookAuthor) {
            const iframe = document.getElementById('pdf-viewer');
            const placeholder = document.getElementById('no-book');
            const header = document.getElementById('viewer-header');
            
            placeholder.style.display = "none";
            iframe.style.display = "block";
            iframe.src = "https://drive.google.com" + fileId;
            
            const authorText = bookAuthor ? ` — Oleh: ${bookAuthor}` : '';
            header.innerText = `${bookTitle}${authorText}`;
            
            document.querySelectorAll('.book-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        window.onload = loadBooks;
    </script>
</body>
</html>
